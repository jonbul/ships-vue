server {
    listen 443 ssl;
    ssl_certificate /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://localhost:3000 ws://localhost:3000 wss://localhost:3000 https://192.168.1.10:3000 ws://192.168.1.10:3000 wss://192.168.1.10:3000 https://192.168.1.11:3000 ws://192.168.1.11:3000 wss://192.168.1.11:3000 https://jonbul.ddns.net:3000 wss://jonbul.ddns.net:3000 https://jonbulserver.taila9852f.ts.net:3000 wss://jonbulserver.taila9852f.ts.net:3000; media-src 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}